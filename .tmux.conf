# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation (deshabilitado vim-tmux-navigator)
# set -g @plugin 'christoomey/vim-tmux-navigator'

# Navegación entre paneles con prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Popup shortcuts (usando prefix)
# Prefix + p: ir a la ventana previa (mantener funcionalidad original)
bind p previous-window

# Prefix + o: Popup simple con shell
bind o display-popup -d "#{pane_current_path}" -E

# Prefix + O: Popup grande (80% de pantalla)
bind O display-popup -d "#{pane_current_path}" -w 80% -h 80% -E

# Prefix + g: Popup con git status
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "git status && echo '\nPresiona Enter para cerrar...' && read"

# Prefix + G: Popup con sesión scratch (floating window - uso general)
bind G display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch"

# Prefix + M: Popup con sesión music (para reproductores de música)
bind M display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s music"

# Prefix + N: Popup con sesión notes (para notas rápidas)
bind N display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s notes"

# Prefix + t: Popup con htop
bind t display-popup -w 90% -h 90% -E "htop"

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Soporte para focus-events (importante para Neovim/Vim)
set -g focus-events on

# Habilitar RGB color (mejora colores en Neovim)
set -as terminal-features ",xterm-256color:RGB"

# Modo vim
set -g mode-keys vi

# Selección de texto estilo Vim mejorada
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip"'

# Escape time más rápido (importante para Vim/Neovim)
set -sg escape-time 10

# Aumentar historial de scroll
set -g history-limit 50000

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Recargar configuración rápidamente
bind r source-file ~/.tmux.conf \; display-message "Config recargada!"

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Redimensionar paneles con prefix + H/J/K/L (mayúsculas)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse support
set -g mouse on

# Status bar position
set -g status-position bottom

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1

# Renumerar ventanas automáticamente
set -g renumber-windows on

# Indicador visual cuando el panel está en zoom (comentado - conflicto con nord-tmux)
# set -g window-status-current-format "#{?window_zoomed_flag,#[fg=red],}#I:#W#{?window_zoomed_flag, 🔍,}"
# set -g window-status-format "#{?window_zoomed_flag,#[fg=red],}#I:#W#{?window_zoomed_flag, 🔍,}"

# Configuración de Nord tmux (desactivada - usando configuración manual)
# set -g @nord_tmux_no_patched_font "1"
# set -g @plugin "arcticicestudio/nord-tmux"

# ===== CONFIGURACIÓN MANUAL DE STATUSLINE NORD CON UI MEJORADA =====

# Desactivar múltiples líneas de status (evita problemas de doble línea)
set -ug status-format
set -gu 'status-format[1]'
set -gu 'status-format[2]'

# Definir colores Nord
set -g status-style "bg=#2e3440,fg=#d8dee9"
set -g status-left-length 40
set -g status-right-length 100
set -g status-interval 5
set -g status-justify left

# Barra izquierda: sesión con indicador visual
set -g status-left "#[fg=#2e3440,bg=#88c0d0,bold] 󱂬 #S #[fg=#88c0d0,bg=#2e3440,nobold] "

# Barra derecha: fecha, hora, hostname
set -g status-right "#[fg=#4c566a,bg=#2e3440]#[fg=#d8dee9,bg=#4c566a] 󰃰 %Y-%m-%d #[fg=#d8dee9,bg=#4c566a] 󰥔 %H:%M #[fg=#88c0d0,bg=#4c566a]#[fg=#2e3440,bg=#88c0d0,bold] 󰒋 #H "

# Ventana activa (sin asterisco, con indicador de zoom si aplica)
set -g window-status-current-format "#[fg=#2e3440,bg=#88c0d0,nobold]#[fg=#2e3440,bg=#88c0d0,bold] #I  #W#{?window_zoomed_flag, 󰊓 ,} #[fg=#88c0d0,bg=#2e3440,nobold]"

# Ventanas inactivas
set -g window-status-format "#[fg=#2e3440,bg=#3b4252,nobold]#[fg=#d8dee9,bg=#3b4252] #I  #W #{?window_zoomed_flag,󰊓 ,}#[fg=#3b4252,bg=#2e3440,nobold]"

# Separador entre ventanas
set -g window-status-separator ""

# Estilos para ventanas con actividad/bells
set -g window-status-activity-style "fg=#ebcb8b,bg=#3b4252"
set -g window-status-bell-style "fg=#bf616a,bg=#3b4252,bold"

# Colores de paneles
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#88c0d0,bold"
set -g display-panes-colour "#4c566a"
set -g display-panes-active-colour "#88c0d0"

# Colores de mensajes
set -g message-style "bg=#3b4252,fg=#88c0d0,bold"
set -g message-command-style "bg=#3b4252,fg=#88c0d0"

# Modo copy (visual mode)
set -g mode-style "bg=#88c0d0,fg=#2e3440,bold"

# Modo reloj
setw -g clock-mode-colour "#88c0d0"

# Notificaciones y alertas visuales
set -g monitor-activity on
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# TokyoNight colors for Tmux (desactivados - usando Nord manual)
# set -g @plugin "janoamaral/tokyo-night-tmux"
# set -g @plugin "tmux-plugins/tmux-battery"
# set -g @plugin "olimorris/tmux-pomodoro-plus"
# set -g @plugin "wabri/tmux-nord-plusplus"
# set -g @plugin "arcticicestudio/nord-tmux"
# set -g @tokyo-night-tmux_transparent 1
# set -g @tokyo-night-tmux_date_format DMY


# TPM init
run '~/.tmux/plugins/tpm/tpm'
