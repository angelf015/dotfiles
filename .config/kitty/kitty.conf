# Remote control for external programs (e.g. sketchybar)
# Using 'socket-only' for better security - only accepts connections via unix socket
allow_remote_control socket-only

# Fix for sudo with TERMINFO environment variable
shell_integration no-sudo

# UNIX socket for remote control (used by sketchybar and other scripts)
listen_on unix:/tmp/kitty

# Kitty theme
include current-theme.conf

#: The value of the TERM environment variable to set. Changing this
#: can break many terminal programs, only change it if you know what
#: you are doing, not because you read some advice on "Stack Overflow"
#: to change it. The TERM variable is used by various programs to get
#: information about the capabilities and behavior of the terminal. If
#: you change it, depending on what programs you run, and how
#: different the terminal you are changing it to is, various things
#: from key-presses, to colors, to various advanced features may not
#: work. Changing this option by reloading the config will only affect
#: newly created windows.
# 
# xterm-kitty is the default, but I'm hardcoding it just in case
term xterm-kitty

# Performance optimizations
repaint_delay 10
input_delay 3
sync_to_monitor yes

font_size 13

# Make sure you have the fonts installed
# This is the only way I could make jetbrains mono work, using the "Mono" word
# at the very end
# font_family      JetBrainsMono Nerd Font
# font_family      JetBrainsMono Nerd Font Mono
# bold_font        JetBrainsMono Nerd Font Mono Extra Bold
# bold_italic_font JetBrainsMono Nerd Font Mono Extra Bold Italic

# JetBrains Mono Nerd Font
font_family      JetBrainsMono Nerd Font Mono

# font_family      Hack Nerd Font Mono

# font_family MesloLGM Nerd Font
# font_family MesloLGS Nerd Font
# font_family MesloLGMDZ Nerd Font

# Kitty's font was more spaced compared to alacritty's, tried font variations
# but it didn't change, so I went with this, it works fine
# modify_font cell_width 95%

# I was going crazy
# after a kitty update, font height seemed smaller, this fixed it
# modify_font cell_height 5px

# Increase scrollback for debugging long logs
scrollback_lines 50000

shell zsh --login

editor nvim

# Hide titlebar but keep round corners
hide_window_decorations titlebar-only

# Window padding: top, right, bottom, left (in pts)
# Large top padding (19) to prevent text from overlapping with titlebar
window_padding_width 19 5 2 2

#: Ask for confirmation when closing an OS window or a tab with at
#: least this number of kitty windows in it by window manager (e.g.
#: clicking the window close button or pressing the operating system
#: shortcut to close windows) or by the close_tab action. A value of
#: zero disables confirmation. This confirmation also applies to
#: requests to quit the entire application (all OS windows, via the
#: quit action). Negative values are converted to positive ones,
#: however, with shell_integration enabled, using negative values
#: means windows sitting at a shell prompt are not counted, only
#: windows where some command is currently running. Note that if you
#: want confirmation when closing individual windows, you can map the
#: close_window_with_confirmation action.
confirm_os_window_close 0

#: The audio bell. Useful to disable it in environments that require
#: silence.
enable_audio_bell no

#: Use the Option key as an Alt key on macOS. With this set to no,
#: kitty will use the macOS native Option+Key to enter Unicode
#: character behavior. This will break any Alt+Key keyboard shortcuts
#: in your terminal programs, but you can use the macOS Unicode input
#: technique. You can use the values: left, right or both to use only
#: the left, right or both Option keys as Alt, instead. Note that
#: kitty itself always treats Option the same as Alt. This means you
#: cannot use this option to configure different kitty shortcuts for
#: Option+Key vs. Alt+Key. Also, any kitty shortcuts using
#: Option/Alt+Key will take priority, so that any such key presses
#: will not be passed to terminal programs running inside kitty.
#: Changing this option by reloading the config is not supported.
macos_option_as_alt right

# NOTE: The neovide cursor type in kitty came during a YouTube livestream by 
# user "Carlos Medina"
#
#: The cursor shape can be one of block, beam, underline. Note that
#: when reloading the config this will be changed only if the cursor
#: shape has not been set by the program running in the terminal. This
#: sets the default cursor shape, applications running in the terminal
#: can override it. In particular, shell integration
#: <https://sw.kovidgoyal.net/kitty/shell-integration/> in kitty sets
#: the cursor shape to beam at shell prompts. You can avoid this by
#: setting shell_integration to no-cursor.
cursor_shape beam

#: The thickness of the beam cursor (in pts).
cursor_beam_thickness 1.5

#: The thickness of the underline cursor (in pts).
cursor_underline_thickness 2.0

#: The interval to blink the cursor (in seconds). Set to zero to
#: disable blinking. Negative values mean use system default. Note
#: that the minimum interval will be limited to repaint_delay.
cursor_blink_interval 0.5

#: Stop blinking cursor after the specified number of seconds of
#: keyboard inactivity. Set to zero to never stop blinking.
cursor_stop_blinking_after 0

# Cursor trail animation for better visual tracking
cursor_trail 1
cursor_trail_decay 0.01 0.5
cursor_trail_start_threshold 0

#: The opacity of the background. A number between zero and one, where
#: one is opaque and zero is fully transparent. This will only work if
#: supported by the OS (for instance, when using a compositor under
#: X11). Note that it only sets the background color's opacity in
#: cells that have the same background color as the default terminal
#: background, so that things like the status bar in vim, powerline
#: prompts, etc. still look good. But it means that if you use a color
#: theme with a background color in your editor, it will not be
#: rendered as transparent. Instead you should change the default
#: background color in your kitty config and not use a background
#: color in the editor color scheme. Or use the escape codes to set
#: the terminals default colors in a shell script to launch your
#: editor. See also transparent_background_colors. Be aware that using
#: a value less than 1.0 is a (possibly significant) performance hit.
#: When using a low value for this setting, it is desirable that you
#: set the background color to a color the matches the general color
#: of the desktop background, for best text rendering. Note that to
#: workaround window managers not doing gamma-corrected blending kitty
#: makes background_opacity non-linear which means, especially for
#: light backgrounds you might need to make the value much lower than
#: you expect to get good results, see 6218
#: <https://github.com/kovidgoyal/kitty/issues/6218> for details.

#: Transparency disabled for better performance and readability
background_opacity 1.0
background_blur 0

#: The edge to show the tab bar on, top or bottom.
tab_bar_edge top
tab_bar_style powerline
# tab_bar_style hidden

# I set it to these keys as they're in my homerow mods df (left) or kj (right)
# The default is ctrl+shift
kitty_mod cmd+option

# Enable layouts that support splits
# splits: allows for arbitrary arrangement of windows
# tall: one window on the left, others stacked on the right
# fat: one window on top, others stacked below
# stack: only one window visible at a time (like fullscreen)
enabled_layouts splits,tall,fat,stack

#: You can also create shortcuts to switch to specific layouts::
map ctrl+cmd+option+u goto_layout tall
map ctrl+cmd+option+i goto_layout fat
map ctrl+cmd+option+o goto_layout stack
map ctrl+cmd+option+p goto_layout splits

# Tab title shows custom title if set, otherwise shows directory name
# Also shows bell and activity symbols for notifications
# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.tab}{title if title else tab.active_wd.rsplit('/', 1)[-1]}"

# Stop kitty shell-integration from changing window/tab titles based on the running command
# This is so that when I open Neovim I don't see that as the tab name
shell_integration no-title

#::  Reload kitty.conf, applying any changes since the last time it
#::  was loaded. Note that a handful of options cannot be dynamically
#::  changed and require a full restart of kitty. Particularly, when
#::  changing shortcuts for actions located on the macOS global menu
#::  bar, a full restart is needed. You can also map a keybinding to
#::  load a different config file, for example::
#::      map f5 load_config /path/to/alternative/kitty.conf
#::  Note that all options from the original kitty.conf are discarded,
#::  in other words the new configuration *replace* the old ones.
# map kitty_mod+f5 load_config_file
map ctrl+cmd+,   load_config_file

##############################################################################
#                    TMUX-STYLE KEYBINDINGS (Ctrl+a prefix)                 #
##############################################################################

# In kitty, windows are what we usually know as panes in tmux, or basically
# splitting the screen

# SPLITS (tmux-style)
# Ctrl+a + v: split vertical (like tmux split-window -h)
map ctrl+a>v launch --location=vsplit --cwd=current
# Ctrl+a + d: split horizontal (like tmux split-window -v) 
map ctrl+a>d launch --location=hsplit --cwd=current
# Alternative: use s for vertical split (tmux default was %)
map ctrl+a>s launch --location=vsplit --cwd=current

# NAVIGATION (vim-style: h/j/k/l)
# Ctrl+a + h/j/k/l: navigate between windows/panes
map ctrl+a>h neighboring_window left
map ctrl+a>j neighboring_window down
map ctrl+a>k neighboring_window up
map ctrl+a>l neighboring_window right

# Also keep direct navigation without prefix (vim-tmux-navigator style)
# Config from knubie/vim-kitty-navigator
# NOTA: ctrl+l se usa para limpiar terminal, usa Ctrl+a+l para navegar derecha
map ctrl+j kitten pass_keys.py bottom ctrl+j "nvim"
map ctrl+k kitten pass_keys.py top    ctrl+k "nvim"
map ctrl+h kitten pass_keys.py left   ctrl+h "nvim"
# map ctrl+l kitten pass_keys.py right  ctrl+l "nvim"  # DESHABILITADO: ctrl+l limpia terminal

# RESIZE (tmux-style with Shift+H/J/K/L)
# Ctrl+a + Shift+H/J/K/L: resize windows
map ctrl+a>shift+h resize_window narrower 5
map ctrl+a>shift+j resize_window shorter 5
map ctrl+a>shift+k resize_window taller 5
map ctrl+a>shift+l resize_window wider 5

# Also keep the alt+cmd shortcuts for resize
map ctrl+cmd+option+h resize_window narrower
map ctrl+cmd+option+l resize_window wider
map ctrl+cmd+option+k resize_window taller
map ctrl+cmd+option+j resize_window shorter 3

# WINDOW MANAGEMENT
# Ctrl+a + x: close window (like tmux kill-pane)
map ctrl+a>x close_window
# Ctrl+a + z: toggle zoom/maximize window (like tmux resize-pane -Z)
map ctrl+a>z toggle_layout stack
# Ctrl+a + Space: rotate through layouts
map ctrl+a>space next_layout

# SWAP/MOVE windows
map ctrl+cmd+h swap_with_window

# CONFIG RELOAD (tmux-style)
# Ctrl+a + r: reload config (like tmux source-file ~/.tmux.conf)
map ctrl+a>r load_config_file

# LEGACY/ADDITIONAL shortcuts (keep for compatibility)
map cmd+enter new_window
map ctrl+shift+l next_window
map ctrl+shift+h previous_window
#: Close window
map kitty_mod+w close_window

# Documentation (floating window)
# https://sw.kovidgoyal.net/kitty/kittens/quick-access-terminal/ 
# For macOS you can go to System Preferences->Keyboard->Keyboard Shortcuts->Services->General and set a shortcut for the Quick access to kitty entry. I prefer calling it from Kanata and not using that shortcut. but If you don't use kanata it's a great option
map kitty_mod+a>d launch --type=background kitten quick-access-terminal
map kitty_mod+a>t launch --type=background kitten quick-access-terminal --config ~/github/dotfiles-latest/kitty/quick-access-terminal-center.conf --instance-group system-task /bin/bash -c '$HOME/github/dotfiles-latest/scripts/macos/mac/misc/240-systemTask.sh'
map kitty_mod+a>c launch --type=background kitten quick-access-terminal --config ~/github/dotfiles-latest/kitty/quick-access-terminal-center.conf --instance-group colorscheme-selector /bin/bash -c '$HOME/github/dotfiles-latest/colorscheme/colorscheme-selector.sh'
map kitty_mod+a>n launch --type=background kitten quick-access-terminal --config ~/github/dotfiles-latest/kitty/quick-access-terminal-daily.conf --instance-group daily-note /bin/bash -c '$HOME/github/dotfiles-latest/scripts/macos/mac/misc/301-dailyNote-float.sh'
map kitty_mod+a>s launch --type=background kitten quick-access-terminal --config ~/github/dotfiles-latest/kitty/quick-access-terminal-daily.conf --instance-group skitty-notes /bin/zsh -i -c 'export NEOVIM_MODE=skitty; export NVIM_APPNAME=neobean; cd "$HOME/github/skitty"; nvim ~/github/skitty/video-ideas.md'

##############################################################################
#                        kitty-scrollback.nvim config                        #
##############################################################################

