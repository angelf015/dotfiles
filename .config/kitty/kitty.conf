##############################################################################
#      Kitty Sessions section (To replace tmux), watch this video:           #
#                  https://youtu.be/lWKjvWvjk4Y                              #
##############################################################################

# Save current state to a session file (prompts for path, opens in $EDITOR)
# Also specify the filename when saving the session:
# ~/github/dotfiles-latest/kitty/sessions/dotfiles.kitty-session
# Ctrl+a + Shift+S: save session (similar to tmux-resurrect prefix+Ctrl+s)
map ctrl+a>shift+shift+s save_as_session --use-foreground-process --relocatable

# Just leaving this here as an example, does not make sense because it would
# restart yabai each time, but useful to understand the alias and combine
# action_alias yabai_restart launch --type=background /bin/zsh -c '"$HOME/github/dotfiles-latest/yabai/yabai_restart.sh"'
# map ctrl+b>h combine : goto_session $HOME/github/dotfiles-latest/kitty/sessions/winhome.kitty-session : yabai_restart

##############################################################################
#                    SESSION MANAGEMENT (tmux-style Ctrl+a)                 #
##############################################################################

# NOTA: Cambiando de ctrl+b a ctrl+a para consistencia con tmux
# Session switcher similar a tmux prefix + key

# Ctrl+a + D (mayúscula): switch to dotfiles session
map ctrl+a>shift+d goto_session $HOME/github/dotfiles-latest/kitty/sessions/dotfiles.kitty-session
map ctrl+a>shift+o goto_session $HOME/github/dotfiles-latest/kitty/sessions/obsidian.kitty-session
map ctrl+a>shift+n goto_session $HOME/github/dotfiles-latest/kitty/sessions/networking.kitty-session
map ctrl+a>shift+h goto_session $HOME/github/dotfiles-latest/kitty/sessions/home.kitty-session
map ctrl+a>shift+b goto_session $HOME/github/dotfiles-latest/kitty/sessions/blogpost.kitty-session
map ctrl+a>shift+p goto_session $HOME/github/dotfiles-latest/kitty/sessions/dots-private.kitty-session
map ctrl+a>shift+a goto_session $HOME/github/dotfiles-latest/kitty/sessions/lua.kitty-session
map ctrl+a>shift+k goto_session $HOME/github/dotfiles-latest/kitty/sessions/skitty.kitty-session
map ctrl+a>semicolon goto_session $HOME/github/dotfiles-latest/kitty/sessions/scripts.kitty-session
map ctrl+a>shift+g goto_session $HOME/github/dotfiles-latest/kitty/sessions/glove80.kitty-session
map ctrl+a>shift+w goto_session $HOME/github/dotfiles-private/work/2026/work.kitty-session

action_alias launch_daily_note launch /bin/zsh -c "$HOME/github/dotfiles-latest/scripts/macos/mac/misc/300-dailyNote.sh"
map ctrl+a>i launch_daily_note

# I call this alias after switching to the alternate session
action_alias update_kitty_name launch --type=background /bin/zsh -c '"$HOME/github/dotfiles-latest/sketchybar/felixkratz-linkarzu/plugins/kitty_name.sh"'

# Switch to alternate kitty session or previous session (like tmux prefix+l)
map ctrl+a>shift+l goto_session -1

# Browse and select from the list of known projects defined via goto_session commands
map ctrl+a>shift+s goto_session

# Interactive session switcher with fzf (visual mode)
map ctrl+a>f launch --type=overlay --hold ~/github/dotfiles-latest/kitty/scripts/kitty-list-sessions.sh

# kitty tab bar only shows tabs from the currently active session
# this works even if all the sessions run in the same os window
# https://github.com/kovidgoyal/kitty/issues/8911#issuecomment-3222346493
tab_bar_filter session:~ or session:^$

# When I open a new tab in a session, I want this tab to only show for that
# session
# https://github.com/kovidgoyal/kitty/issues/8911#issuecomment-3224876629
map cmd+t new_tab_with_cwd

##############################################################################
#                    TAB MANAGEMENT (tmux-style Ctrl+a)                     #
##############################################################################

# En tmux, las "windows" son equivalentes a los "tabs" en Kitty
# Replicando comportamiento de tmux para tabs

# TAB CREATION/CLOSING
# Ctrl+a + c: create new tab (like tmux prefix+c for new window)
map ctrl+a>c new_tab_with_cwd
# Ctrl+a + &: close tab with confirmation (like tmux prefix+&)
map ctrl+a>shift+7 close_tab_with_confirmation
# Ctrl+a + q: close tab without confirmation (alternative)
map ctrl+a>q close_tab

# TAB NAVIGATION
# Ctrl+a + n: next tab (like tmux prefix+n)
map ctrl+a>n next_tab
# Ctrl+a + p: previous tab (like tmux prefix+p)  
# NOTA: cambiando 'p' de previous-window a previous tab
# El atajo shift+p ya se usa para dots-private session
map ctrl+a>shift+comma previous_tab

# TAB SELECTION BY NUMBER
# Ctrl+a + 1-9: go to specific tab (like tmux prefix+1-9)
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# TAB RENAMING
# Ctrl+a + ,: rename tab (like tmux prefix+,)
map ctrl+a>comma set_tab_title

# TAB MOVING
# Ctrl+a + <: move tab left
map ctrl+a>shift+, move_tab_backward
# Ctrl+a + >: move tab right  
map ctrl+a>shift+. move_tab_forward

# LEGACY: mantener cmd+t para compatibilidad
# (ya está definido arriba)

##############################################################################
#                          TERMINAL OPERATIONS                               #
##############################################################################

# Clear terminal - sends Ctrl+L to execute 'clear' command
# NOTA: Cambiado de cmd+k a ctrl+l (estilo tmux/bash default)
map ctrl+l send_text all \x0c

# Mantener cmd+k como alternativa para usuarios de macOS
map cmd+k send_text all \x0c
